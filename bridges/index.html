<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<meta name="robots" content="noindex">

<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
<title>Bridges</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Atkinson+Hyperlegible:wght@400;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one narrow column, one pair at a time; the two ideas sit at opposite ends of a dashed arrow the player has to cross. */
:root{
  --bg:#fbf3e4; --surface:#fffaf1; --ink:#22262f; --muted:#6d6a63; --line:#e3d8c4;
  --accent:#2f5d7c; --accent-soft:#dbe7ee; --ai:#8a5a8c; --ai-soft:#efe3ef; --star:#c7902f;
  --display:"Instrument Serif", Georgia, "Times New Roman", serif;
  --body:"Atkinson Hyperlegible", system-ui, -apple-system, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#17191e; --surface:#1f2228; --ink:#ece6da; --muted:#a39d92; --line:#343840;
  --accent:#8fb8d4; --accent-soft:#24323d; --ai:#c9a1cb; --ai-soft:#33273a; --star:#e2b55c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#17191e; --surface:#1f2228; --ink:#ece6da; --muted:#a39d92; --line:#343840;
  --accent:#8fb8d4; --accent-soft:#24323d; --ai:#c9a1cb; --ai-soft:#33273a; --star:#e2b55c; color-scheme:dark}

body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 48px}
.wrap{max-width:620px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.brand{font-family:var(--display);font-size:30px;letter-spacing:.01em}
.langsel{font:inherit;font-size:14px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 12px}
h1,h2{font-family:var(--display);font-weight:400;text-wrap:balance;margin:0}
h1{font-size:clamp(34px,7vw,46px);line-height:1.08}
h2{font-size:28px;line-height:1.15}
p{margin:0;max-width:62ch}
.muted{color:var(--muted)}
.small{font-size:14px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px;display:flex;flex-direction:column;gap:16px}
ul.plain{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}

.pills{display:flex;flex-wrap:wrap;gap:6px}
.pills label{position:relative;display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-weight:400;font-size:15px;cursor:pointer;background:var(--bg)}
.pills input{position:absolute;opacity:0;width:1px;height:1px;pointer-events:none}
.pills label:has(input:checked){background:var(--accent-soft);border-color:var(--accent)}
.pills label:focus-within{outline:2px solid var(--accent);outline-offset:2px}
.q{display:flex;flex-direction:column;gap:8px}
.qt{font-weight:700;font-size:15px}
.scale-ends{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);max-width:320px}
.diff{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:14px;color:var(--muted)}
.diff button{background:transparent;color:var(--muted);border:1px solid var(--line);padding:4px 12px;font-size:14px;font-weight:400}
.diff button[aria-pressed="true"]{background:var(--accent-soft);color:var(--ink);border-color:var(--accent)}
.dat{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.helpq{width:32px;height:32px;border-radius:50%;padding:0;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-weight:700;font-size:16px;line-height:1}
.helpq[aria-expanded="true"]{border-color:var(--accent);background:var(--accent-soft)}
.helpbox{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px 22px;display:flex;flex-direction:column;gap:10px}
.helpbox ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.langchips{display:flex;flex-wrap:wrap;gap:6px}
.langchips button{background:transparent;color:var(--muted);border:1px solid var(--line);padding:5px 12px;font-size:14px;font-weight:400}
.langchips button.on{background:var(--accent-soft);color:var(--ink);border-color:var(--accent)}
.langs{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.langs button{background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:16px;font-family:var(--display);font-size:24px;font-weight:400;text-align:left}
.langs button:hover{border-color:var(--accent)}
.hello{display:flex;flex-direction:column;gap:2px;font-family:var(--display);font-size:20px;line-height:1.3;color:var(--muted)}
.hello span:first-child{color:var(--ink);font-size:clamp(30px,6vw,40px)}

.pair{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;padding-block:8px}
.idea{font-family:var(--display);font-size:clamp(24px,6vw,34px);line-height:1.1;text-align:center;text-wrap:balance;min-width:0}
.gap{position:relative;width:clamp(44px,14vw,110px);height:2px;background:repeating-linear-gradient(90deg,var(--accent) 0 6px,transparent 6px 12px)}
.gap::after{content:"";position:absolute;right:0;top:50%;width:10px;height:10px;border-top:2px solid var(--accent);border-right:2px solid var(--accent);transform:translateY(-50%) rotate(45deg)}
.tag{display:inline-block;font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

label{font-weight:700;font-size:15px}
textarea,input[type=text],input[type=email]{width:100%;box-sizing:border-box;font:inherit;color:var(--ink);background:var(--bg);
  border:1px solid var(--line);border-radius:10px;padding:12px 14px}
textarea{min-height:120px;resize:vertical}
textarea:focus,input:focus,button:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.stones{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
@media (max-width:480px){.stones{grid-template-columns:1fr}}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.spread{justify-content:space-between}
button{font:inherit;font-weight:700;border-radius:999px;padding:11px 20px;cursor:pointer;border:1px solid transparent}
.primary{background:var(--accent);color:var(--bg)}
.primary:disabled{opacity:.45;cursor:not-allowed}
.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.link{background:none;border:0;padding:6px 2px;color:var(--muted);font-weight:400;text-decoration:underline;text-underline-offset:3px}
.aibtn{background:var(--ai-soft);color:var(--ai);border-color:transparent}
.mic{display:inline-flex;align-items:center;gap:8px;background:transparent;color:var(--accent);border-color:var(--line);padding:8px 14px;font-size:15px}
.mic[aria-pressed="true"]{background:var(--accent);color:var(--bg);border-color:var(--accent)}
.mic svg{width:16px;height:16px}
.micnote{font-size:13px;color:var(--muted)}
.ai{background:var(--ai-soft);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:8px}
.ai .tag{color:var(--ai)}
.choice{display:flex;flex-direction:column;gap:8px}
.choice label{font-weight:400;display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:10px;cursor:pointer}
.choice input{margin-top:5px}
.qlabel{font-weight:700;font-size:15px;border:0!important;padding:0!important;cursor:default!important}
.check{font-weight:400;display:flex;gap:10px;align-items:flex-start}
.check input{margin-top:5px}
.progress{height:4px;background:var(--line);border-radius:4px;overflow:hidden}
.progress span{display:block;height:100%;background:var(--accent);transition:width .3s}
@media (prefers-reduced-motion:reduce){.progress span{transition:none}}
.bridge{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:15px}
.chip{background:var(--accent-soft);border-radius:999px;padding:3px 10px}
.arrow{color:var(--muted)}
.count{font-family:var(--display);font-size:22px}
.code{font-family:var(--mono);font-size:17px;background:var(--accent-soft);border-radius:8px;padding:4px 10px;user-select:all}
.stars{display:flex;gap:6px}
.stars button{background:transparent;border:1px solid var(--line);padding:6px 10px;font-size:22px;line-height:1;color:var(--muted)}
.stars button.on{color:var(--star);border-color:var(--star)}
.confirm{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:10px}
.list-item{display:flex;flex-direction:column;gap:6px;padding-block:10px;border-top:1px solid var(--line)}
.section{display:flex;flex-direction:column;gap:8px;padding-top:14px;border-top:1px solid var(--line)}
details{border-top:1px solid var(--line);padding-top:14px}
summary{cursor:pointer;font-family:var(--mono);font-size:12px;letter-spacing:.06em;color:var(--muted)}
pre{font-family:var(--mono);font-size:12px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px;overflow:auto;max-height:340px}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div class="brand">Bridges</div>
    <div class="row" style="gap:12px"><button class="link" id="startover" type="button" hidden>Start over</button><select class="langsel" id="langsel" aria-label="Language" hidden></select><button class="helpq" id="helpbtn" type="button" aria-expanded="false" aria-label="How it works">?</button></div>
  </header>
  <div id="helpbox"></div>
  <div id="topconfirm"></div>
  <div class="progress" aria-hidden="true"><span id="bar" style="width:0%"></span></div>
  <main id="app"></main>
  <details id="debugview" hidden>
    <summary>Researcher view</summary>
    <p class="small muted" style="margin-top:10px">What this visit sends to the database. Shown only with ?debug in the address.</p>
    <div class="row" style="margin-block:10px"><button class="ghost" id="resetproto" type="button">Reset this device and start fresh</button></div>
    <pre id="log">{}</pre>
  </details>
</div>

// ================= Player memory (this device only) =================
const KEY = "bridges.player.v2";
const load = () => { try{ return JSON.parse(localStorage.getItem(KEY)||"null"); }catch(e){ return null; } };
const save = p => { if(!p) return; try{ localStorage.setItem(KEY, JSON.stringify(p)); }catch(e){} };
const wipe = () => { try{ localStorage.removeItem(KEY); }catch(e){} };
const WORDS = ["bee","river","salt","seed","stone","cloud","moon","honey","spider","echo","shadow","wind","sand","bird","key","rain"];
const makeCode = () => { const r = () => WORDS[Math.floor(Math.random()*WORDS.length)]; let a=r(), b=r(); while(b===a) b=r(); return `${a}-${b}-${10+Math.floor(Math.random()*90)}`; };

let P = load();
const returning = !!(P && P.code);
let L = (P && P.lang) || null;
const shuffle = a => a.map(x=>[Math.random(),x]).sort((p,q)=>p[0]-q[0]).map(p=>p[1]);
const S = { visitStarted:new Date().toISOString(), returning, trials:[], end:{}, feedback:null };

let coreOrder=[], byLevel={}, levelCycle=shuffle(["cc","ca","aa"]), poolTurn=0, step=0, coreThisVisit=0;

// ================= Backend =================
const API = "/bridges/api";
const QKEY = "bridges.queue.v1";
const testerKey = (() => { try{ const k = new URLSearchParams(location.search).get("tester"); if(k) sessionStorage.setItem("bridges.tester", k); return sessionStorage.getItem("bridges.tester") || ""; }catch(e){ return ""; } })();
// Every write goes through a small queue kept on the device, so nothing is lost on a weak connection.
const loadQ = () => { try{ return JSON.parse(localStorage.getItem(QKEY) || "[]"); }catch(e){ return []; } };
const saveQ = q => { try{ localStorage.setItem(QKEY, JSON.stringify(q.slice(-300))); }catch(e){} };
let flushing = false;
async function flush(){
  if(flushing) return; flushing = true;
  try{
    while(true){
      const q = loadQ(); if(!q.length) break;
      const it = q[0]; let done = false;
      try{ const r = await fetch(API + "/" + it.k, {method:"POST", headers:{"content-type":"application/json"}, body:JSON.stringify(it.b)}); done = r.ok || (r.status >= 400 && r.status < 500); }catch(e){ done = false; }
      if(!done) break;
      const q2 = loadQ(); q2.shift(); saveQ(q2);
    }
  } finally { flushing = false; }
}
function post(kind, data){
  let payload;
  if(kind === "player") payload = {code:P.code, grp:P.group, lang:L, restored:!!P.restoredFromCode, visits:P.visits || 1, answeredEnd:!!P.answeredEnd, feedbackGiven:!!P.feedbackGiven, testerKey};
  else if(kind === "feedback" || kind === "email") payload = data;      // never sent together with the player code
  else payload = {...data, code:P.code};
  const q = loadQ(); q.push({k:kind, b:payload}); saveQ(q); flush();
}
function apiDelete(code){
  saveQ(loadQ().filter(it => !(it.b && it.b.code === code)));
  fetch(API + "/player/" + encodeURIComponent(code), {method:"DELETE"}).catch(()=>{});
}
// Hand out the pairs and directions with the fewest answers so far.
let COUNTS = {}, countsReady = Promise.resolve();
function fetchCounts(ids){
  return fetch(API + "/counts", {method:"POST", headers:{"content-type":"application/json"}, body:JSON.stringify({pairs:ids})})
    .then(r => r.ok ? r.json() : {}).then(c => { COUNTS = c || {}; }).catch(() => {});
}
const cnt = (id, d) => (COUNTS[id] && COUNTS[id][d]) || 0;
const total = id => cnt(id,"ab") + cnt(id,"ba");
function dirFor(id){ const a = cnt(id,"ab"), b = cnt(id,"ba"); return a === b ? (Math.random() < 0.5 ? "ab" : "ba") : (a < b ? "ab" : "ba"); }
function countAnswer(tr){ COUNTS[tr.pair] = COUNTS[tr.pair] || {ab:0, ba:0}; COUNTS[tr.pair][tr.dir] = (COUNTS[tr.pair][tr.dir] || 0) + 1; }
flush();
function setupPairs(){
  const seen = new Set((P?.bridges||[]).map(b=>b.pair));
  coreOrder = shuffle(CORE.filter(p=>!seen.has(p.id))).map(p=>({...p,set:"core"}));
  coreThisVisit = coreOrder.length;
  const left = POOL.filter(p=>!seen.has(p.id));
  byLevel = {cc:shuffle(left.filter(p=>p.level==="cc")), ca:shuffle(left.filter(p=>p.level==="ca")), aa:shuffle(left.filter(p=>p.level==="aa"))};
  countsReady = fetchCounts([...coreOrder, ...left].map(p=>p.id));
}
function nextPoolPair(){
  for(let k=0;k<3;k++){ const lv = levelCycle[(poolTurn+k)%3];
    if(byLevel[lv].length){ poolTurn=(poolTurn+k+1)%3; byLevel[lv].sort((x,y)=>total(x.id)-total(y.id) || Math.random()-0.5); return {...byLevel[lv].shift(), set:"open"}; } }
  return null;
}

      P = { code:v, lang:L, group:j.grp, firstVisit:j.first_seen, visits:(j.visits||1) + 1, bridges:j.bridges || [], warmup:j.warmup,
            answeredEnd:!!j.answered_end, feedbackGiven:!!j.feedback_given, restoredFromCode:true, sawAI:!!j.saw_ai, usedAI:!!j.used_ai };

    <div class="row spread"><button class="primary" id="wgo" disabled>${t("wuGo")}</button><button class="link" id="wskip">${t("wuSkip")}</button></div>
  </section>`;
  const ins = Array.from({length:10},(_,i)=>document.getElementById("w"+i));
  const go = document.getElementById("wgo"), cnt = document.getElementById("wcount");
  const words = () => ins.map(x=>x.value.trim()).filter(Boolean);
  const recount = () => { const n = words().length; cnt.textContent = t("wuCount")(n); go.disabled = n < 7; };
  ins.forEach(x => { x.addEventListener("input", recount); x.addEventListener("paste", () => w.pasted = true); });
  if(prev){ prev.vals.forEach((v,i)=>ins[i].value = v); recount(); }
  redraw = () => warmup({w, vals: ins.map(x=>x.value)});
  go.onclick = () => { P.warmup = {words:words(), ms:Date.now()-w.shownAt, pasted:w.pasted, lang:L}; save(P); post("warmup", P.warmup); updateLog(); setupPairs(); next(); };
  document.getElementById("wskip").onclick = () => { P.warmup = {skipped:true}; save(P); post("warmup", {skipped:true, lang:L}); updateLog(); setupPairs(); next(); };
  updateLog();
}

// ================= Play =================
async function next(){
  await Promise.race([countsReady, new Promise(r => setTimeout(r, 1500))]);
  let p = step < coreThisVisit ? coreOrder[step] : nextPoolPair();
  if(!p){ allDone(); return; }
  p = dirFor(p.id) === "ba" ? {...p, a:p.b, b:p.a, dir:"ba"} : {...p, dir:"ab"};
  step++; setBar(); trial(p);
}

function allDone(){
  redraw = allDone;
  app.innerHTML = `
  <section class="panel">
    <span class="tag">${t("allDoneTag")}</span>
    <p class="count">${t("built")(P.bridges.length)}</p>
    <p>${t("allDoneP")}</p>
    <div class="row"><button class="primary" id="fin">${t("cont")}</button></div>
  </section>`;
  document.getElementById("fin").onclick = () => finalQuestions();
}

function trial(p, prev){
  const inCore = p.set==="core";
  const tr = prev ? Object.assign(prev.tr, {from:word(p.a), to:word(p.b), lang:L, langSwitched:true}) : {pair:p.id, set:p.set, level:p.level, dir:p.dir, fromKey:p.a, toKey:p.b, from:word(p.a), to:word(p.b), lang:L,
              group:P.group, visit:P.visits, position:step, shownAt:Date.now(), firstKeyMs:null, submitMs:null,
              pasted:false, pastedChars:0, voice:false, aiRequested:false, difficulty:null, answer:"", stones:[], revised:false, final:""};
  app.innerHTML = `
  <section class="panel">
    <div class="row spread"><span class="tag">${inCore ? t("pairOf")(step, coreThisVisit) : t("openPlay")}</span><button class="link" id="stop">${t("done")}</button></div>
    <div class="pair"><div class="idea">${esc(tr.from)}</div><div class="gap"></div><div class="idea">${esc(tr.to)}</div></div>
    <div class="choice" style="gap:6px">
      <label for="ans" class="qlabel">${t("question")}</label>
      <textarea id="ans" placeholder="${t("ansPh")}"></textarea>
      <div class="row"><button class="mic" id="mic" aria-pressed="false" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg><span id="micLabel">${t("speak")}</span></button><span class="micnote" id="micNote"></span></div>
    </div>
    <div>
      <label>${t("stones")} <span class="muted small" style="font-weight:400">${t("stonesHint")}</span></label>
      <div class="stones" style="margin-top:8px">
        <input type="text" id="s1" placeholder="${t("first")}"><input type="text" id="s2" placeholder="${t("then")}"><input type="text" id="s3" placeholder="${t("then")}">
      </div>
    </div>
    <div id="aibox"></div>
    <div class="diff" id="diff"><span>${t("diffQ")}</span>${["easy","medium","hard"].map(d=>`<button type="button" data-d="${d}" aria-pressed="false">${t(d)}</button>`).join("")}</div>
    <div class="row">
      <button class="primary" id="send" disabled>${t("next")}</button>
      <button class="aibtn" id="askai">${t("askAI")}</button>
      ${inCore ? `` : `<button class="ghost" id="skip">${t("skip")}</button>`}
    </div>
  </section>`;
  const ans = document.getElementById("ans"), send = document.getElementById("send");
  ans.addEventListener("input", () => { if(tr.firstKeyMs===null) tr.firstKeyMs = Date.now()-tr.shownAt; send.disabled = !ans.value.trim(); });
  ans.addEventListener("paste", e => { tr.pasted = true; tr.pastedChars += (e.clipboardData?.getData("text")||"").length; });
  app.querySelectorAll("#diff button").forEach(b => b.onclick = () => {
    const on = tr.difficulty !== b.dataset.d; tr.difficulty = on ? b.dataset.d : null;
    app.querySelectorAll("#diff button").forEach(x => x.setAttribute("aria-pressed", String(on && x===b)));
  });
  // Changing language mid-pair redraws the pair in the new language and keeps what was written.
  if(prev){
    ans.value = prev.vals.ans; ["s1","s2","s3"].forEach((k,i)=>document.getElementById(k).value = prev.vals.stones[i]); send.disabled = !ans.value.trim();
    if(tr.difficulty) app.querySelectorAll("#diff button").forEach(x=>x.setAttribute("aria-pressed", String(x.dataset.d===tr.difficulty)));
    if(tr.aiRequested){ const a = document.getElementById("askai"); if(a) a.disabled = true; document.getElementById("aibox").innerHTML = aiCard(p, t("aiHintChoose")); }
  }
  redraw = () => trial(p, {tr, vals:{ans:ans.value, stones:["s1","s2","s3"].map(k=>document.getElementById(k).value)}});

  // Voice: recorded in the browser, transcribed in our own Cloudflare account, and the audio is discarded.
  const mic = document.getElementById("mic"), micNote = document.getElementById("micNote"), micLabel = document.getElementById("micLabel");
  let rec = null, chunks = [];
  const stopMic = () => { mic.setAttribute("aria-pressed","false"); micLabel.textContent = t("speak"); };
  const noVoice = () => { stopMic(); micNote.textContent = t("noVoice"); };
  mic.onclick = async () => {
    if(rec){ try{ rec.stop(); }catch(e){} return; }
    if(!navigator.mediaDevices || !window.MediaRecorder){ noVoice(); return; }
    try{
      const stream = await navigator.mediaDevices.getUserMedia({audio:true});
      chunks = []; rec = new MediaRecorder(stream);
      rec.ondataavailable = e => { if(e.data && e.data.size) chunks.push(e.data); };
      rec.onstop = async () => {
        stream.getTracks().forEach(x => x.stop()); rec = null; stopMic();
        const blob = new Blob(chunks, {type:(chunks[0] && chunks[0].type) || "audio/webm"}); chunks = [];
        if(!blob.size) return;
        micNote.textContent = t("transcribing");
        try{
          const r = await fetch(API + "/transcribe?lang=" + L, {method:"POST", headers:{"content-type":blob.type}, body:blob});
          const j = r.ok ? await r.json() : {};
          if(j.text){ ans.value = (ans.value ? ans.value.trim() + " " : "") + j.text.trim(); tr.voice = true;
            if(tr.firstKeyMs === null) tr.firstKeyMs = Date.now() - tr.shownAt; send.disabled = !ans.value.trim(); micNote.textContent = ""; updateLog(); }
          else micNote.textContent = t("noVoice");
        }catch(e){ micNote.textContent = t("noVoice"); }
      };
      rec.start(); mic.setAttribute("aria-pressed","true"); micLabel.textContent = t("listening"); micNote.textContent = "";
    }catch(e){ rec = null; noVoice(); }
  };
  const stopRec = () => { if(rec){ try{ rec.stop(); }catch(e){} } };

  document.getElementById("stop").onclick = () => { stopRec(); finalQuestions(); };
  const skip = document.getElementById("skip");
  if(skip) skip.onclick = () => { stopRec(); tr.skipped = true; S.trials.push(tr); post("trial", tr); updateLog(); next(); };
  const ask = document.getElementById("askai");
  if(ask) ask.onclick = () => { tr.aiRequested = true; ask.disabled = true; document.getElementById("aibox").innerHTML = aiCard(p, t("aiHintChoose")); updateLog(); };
  send.onclick = () => {
    stopRec();
    tr.answer = ans.value.trim();
    tr.stones = ["s1","s2","s3"].map(k=>document.getElementById(k).value.trim()).filter(Boolean);
    tr.submitMs = Date.now()-tr.shownAt;
    tr.final = tr.answer; record(tr); afterTrial();
  };
}

function record(tr){
  if(tr.aiRequested) P.sawAI = true;
  if(tr.aiRequested) P.usedAI = true;
  tr.aiShown = !!(tr.aiRequested);
  S.trials.push(tr); countAnswer(tr); post("trial", tr);
  P.bridges.push({pair:tr.pair, from:tr.from, to:tr.to, stones:tr.stones, final:tr.final, lang:tr.lang, at:new Date().toISOString()});
  save(P); updateLog();
}

function aiCard(p, hint){
  const e = AI_BRIDGES && (AI_BRIDGES[L] || AI_BRIDGES.en) && (AI_BRIDGES[L] || AI_BRIDGES.en)[p.id];
  const txt = e ? e[p.dir === "ba" ? 1 : 0] : t("aiPending");
  return `<div class="ai"><span class="tag">${t("aiTag")}</span><p>${esc(txt)}</p><p class="small muted">${hint}</p></div>`;
}

function revealAfter(p,tr,revText){
  tr.from = word(p.a); tr.to = word(p.b);
  app.innerHTML = `
  <section class="panel">
    <span class="tag">${p.set==="core" ? t("pairOf")(step, coreThisVisit) : t("openPlay")}</span>
    <div class="pair"><div class="idea">${esc(tr.from)}</div><div class="gap"></div><div class="idea">${esc(tr.to)}</div></div>
    <div><span class="tag">${t("yourBridge")}</span><p style="margin-top:6px">${esc(tr.answer)}</p></div>
    ${aiCard(p, t("aiHintAfter"))}
    <div class="choice">
      <label for="rev" class="qlabel">${t("changeQ")}</label>
      <textarea id="rev">${esc(tr.answer)}</textarea>
    </div>
    <div class="row"><button class="primary" id="keep">${t("keepMine")}</button><button class="ghost" id="save">${t("saveChanges")}</button></div>
  </section>`;
  if(revText !== undefined) document.getElementById("rev").value = revText;
  redraw = () => revealAfter(p, tr, document.getElementById("rev").value);
  const done = revised => {
    const v = document.getElementById("rev").value.trim();
    tr.revised = revised && v !== tr.answer; tr.final = revised ? v : tr.answer;
    record(tr); afterTrial();
  };
  document.getElementById("keep").onclick = () => done(false);
  document.getElementById("save").onclick = () => done(true);
}

function afterTrial(){ if(coreThisVisit && step === coreThisVisit) coreDone(); else next(); }

function coreDone(){
  redraw = coreDone;
  app.innerHTML = `
  <section class="panel">
    <span class="tag">${t("coreTag")}</span>
    <p class="count">${t("built")(P.bridges.length)}</p>
    <p>${t("coreP")}</p>
    <div class="row"><button class="primary" id="more">${t("keepGoing")}</button><button class="ghost" id="fin">${t("finishHere")}</button></div>
  </section>`;
  document.getElementById("more").onclick = () => next();
  document.getElementById("fin").onclick = () => finalQuestions();
}

// ================= End =================
// One-tap optional choices.
const pills = (name, opts) => `<div class="pills" role="radiogroup">${opts.map(([v,l])=>`<label><input type="radio" name="${name}" value="${v}">${l}</label>`).join("")}</div>`;
const picked = name => (document.querySelector(`input[name="${name}"]:checked`)||{}).value || null;
const q = (title, body) => `<div class="q"><span class="qt">${title}</span>${body}</div>`;

function finalQuestions(){
  if(P.answeredEnd){ feedback(); return; }
  redraw = () => {
    const keep = [...document.querySelectorAll("input[type=radio]:checked")].map(x=>[x.name,x.value]);
    finalQuestions();
    keep.forEach(([n,v]) => { const el = document.querySelector(`input[name="${n}"][value="${v}"]`); if(el) el.checked = true; });
  };
  const isNew = !(P.restoredFromCode || P.visits>1);
  const NA = ["na", t("prefer")];
  const LANGLIST = [["en","English"],["fr","Français"],["es","Español"],["it","Italiano"],["de","Deutsch"],["pt","Português"],["zh","中文"],["ja","日本語"],["ar","العربية"],["hi","हिन्दी"],["ru","Русский"],["other",t("langOther")],NA];
  app.innerHTML = `
  <section class="panel">
    <h2>${t("qH2")}</h2>
    <p class="small muted">${t("allOptional")}</p>
    ${isNew ? q(t("before"), pills("before", [["no",t("beforeNo")],["yes",t("beforeYes")]])) : ""}
    ${q(t("ext"), pills("ext", [["no",t("extNo")],["some",t("extSome")],["most",t("extMost")],["na",t("extSkip")]]))}
    ${q(t("aiFreq"), pills("freq", [["never",t("freqNever")],["month",t("freqMonth")],["week",t("freqWeek")],["day",t("freqDay")],NA]))}
    ${q(t("aiFeel"), pills("feel", [["concerned",t("feelConcern")],["both",t("feelBoth")],["excited",t("feelExcited")],NA]))}
    ${P.sawAI ? q(t("cmpQ"), pills("cmp", [["weaker",t("weaker")],["same",t("same")],["stronger",t("stronger")],["unsure",t("notsure")]])) : ""}
    ${P.usedAI ? q(t("ownQ"), pills("own", [1,2,3,4,5].map(n=>[String(n),String(n)])) + `<div class="scale-ends"><span>1 · ${t("own1")}</span><span>5 · ${t("own5")}</span></div>`) : ""}
    ${q(t("firstLang"), pills("flang", LANGLIST))}
    ${q(t("ageQ"), pills("age", [["18-24","18–24"],["25-34","25–34"],["35-44","35–44"],["45-54","45–54"],["55-64","55–64"],["65+","65+"],NA]))}
    ${q(t("fieldQ"), pills("field", [["arts",t("arts")],["sci",t("sci")],["eng",t("eng")],["soc",t("soc")],["health",t("health")],["biz",t("biz")],["edu",t("edu")],["other",t("otherF")],NA]))}
    <div class="row"><button class="primary" id="fin">${t("cont")}</button></div>
  </section>`;
  document.getElementById("fin").onclick = () => {
    S.end = { playedBefore:picked("before"), externalAI:picked("ext"), aiFrequency:picked("freq"), aiFeeling:picked("feel"),
              aiComparison:picked("cmp"), ownership:picked("own"), firstLanguage:picked("flang"), ageBand:picked("age"), field:picked("field") };
    P.answeredEnd = true; save(P); post("end", S.end); post("player"); updateLog(); feedback();
  };
}

function feedback(prev){
  if(P.feedbackGiven){ thanks(); return; }
  let rating = prev ? prev.rating : 0;
  app.innerHTML = `
  <section class="panel">
    <h2>${t("fbH2")}</h2>
    <p class="muted small">${t("fbSmall")}</p>
    <div class="stars" role="group" aria-label="1–5">${[1,2,3,4,5].map(n=>`<button type="button" data-n="${n}" aria-label="${n}/5">★</button>`).join("")}</div>
    <div class="choice">
      <label for="fb" class="qlabel">${t("fbQ")}</label>
      <textarea id="fb" placeholder="${t("fbPh")}"></textarea>
    </div>
    <div class="choice">
      <label for="mail" class="qlabel">${t("mailQ")} <span class="muted small" style="font-weight:400">${t("optional")}</span></label>
      <input type="email" id="mail" placeholder="${t("mailPh")}">
      <p class="small muted">${t("mailNote")}</p>
    </div>
    <div class="row"><button class="primary" id="sendfb">${t("send")}</button><button class="ghost" id="skipfb">${t("skipBtn")}</button></div>
  </section>`;
  if(prev){ document.getElementById("fb").value = prev.fb; document.getElementById("mail").value = prev.mail;
    app.querySelectorAll(".stars button").forEach(x => x.classList.toggle("on", +x.dataset.n <= rating)); }
  redraw = () => feedback({rating, fb:document.getElementById("fb").value, mail:document.getElementById("mail").value});
  app.querySelectorAll(".stars button").forEach(b => b.onclick = () => {
    rating = +b.dataset.n; app.querySelectorAll(".stars button").forEach(x => x.classList.toggle("on", +x.dataset.n <= rating));
  });
  document.getElementById("sendfb").onclick = () => {
    S.feedback = { rating: rating || null, comment: document.getElementById("fb").value.trim() || null, lang:L, linkedToAnswers:false };
    const mail = document.getElementById("mail").value.trim();
    S.resultsEmailList = mail ? "one email added to a separate list" : null;
    if(rating || S.feedback.comment) post("feedback", {rating: rating || null, comment: S.feedback.comment, lang:L});
    if(mail) post("email", {email: mail, lang:L});
    P.feedbackGiven = true; save(P); post("player"); updateLog(); thanks();
  };
  document.getElementById("skipfb").onclick = () => thanks();
}

function thanks(){
  redraw = thanks;
  bar.style.width = "100%";
  const v = S.trials.filter(x=>!x.skipped && x.final);
  app.innerHTML = `
  <section class="panel">
    <h2>${t("thanksH2")}</h2>
    <p>${t("thanksP")(v.length, P.bridges.length)}</p>
    ${v.map(bridgeHTML).join("")}
    <div class="section">
      <span class="tag">${t("aboutTag")}</span>
      <p class="small">${t("aboutP")}</p>
      <p class="small muted">${t("aboutNote")}</p>
    </div>
    <div class="section">
      <span class="tag">${t("codeTag")}</span>
      <p><span class="code">${esc(P.code)}</span></p>
      <p class="small muted">${t("codeNote")}</p>
    </div>
    <div class="row"><button class="primary" id="again">${t("playMore")}</button><button class="ghost" id="mine">${t("seeAll")}</button></div>
    <div id="leavezone"><button class="link" id="leave">${t("leave")}</button></div>
  </section>`;
  document.getElementById("again").onclick = () => { step = 0; S.trials = []; setupPairs(); next(); };
  document.getElementById("mine").onclick = () => myBridges();
  wireLeave("leave","leavezone");
}

// ================= Start =================
try{ if(new URLSearchParams(location.search).has("debug")) document.getElementById("debugview").hidden = false; }catch(e){}
// Opens straight on the welcome page, in the browser's language when it is one of the five, otherwise English.
function detectLang(){ const b = (navigator.language||"en").slice(0,2).toLowerCase(); return LANGS.some(([c])=>c===b) ? b : "en"; }
if(returning && L){
  document.documentElement.lang = L;
  // Someone who left before building any bridge sees the normal intro again; Start picks up where they were.
  if(!P.bridges.length) welcome();
  else welcomeBack(true);
} else { setLang(detectLang()); welcome(); }
</script>
